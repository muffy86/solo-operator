name: solo-operator

services:
  # ── Node.js API ──
  api:
    build: ./my-node-app
    container_name: my-node-app
    ports:
      - "3000:3000"
    env_file: ./my-node-app/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DB_URL=sqlite:///data/app.db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - backend
    volumes:
      - api_data:/app/data

  # ── Redis Cache ──
  redis:
    image: redis:7-alpine
    container_name: my-node-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      - backend
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]

  # ── CSV Pipeline ──
  pipeline:
    build: ./csv-pipeline
    container_name: csv-pipeline
    volumes:
      - ./csv-pipeline/incoming:/app/incoming
      - ./csv-pipeline/processed:/app/processed
      - ./csv-pipeline/archive:/app/archive
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_INTERVAL=10
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_URL=
    command: python pipeline.py --watch --interval 10
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  # ── CSV Dashboard ──
  dashboard:
    build: ./csv-pipeline/dashboard
    container_name: csv-dashboard
    ports:
      - "8500:8500"
    volumes:
      - ./csv-pipeline/incoming:/app/incoming
      - ./csv-pipeline/processed:/app/processed
      - ./csv-pipeline/archive:/app/archive
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      - backend
    depends_on:
      pipeline:
        condition: service_started

  # ── Status Page (lightweight) ──
  status:
    image: nginx:latest
    container_name: solo-status
    ports:
      - "8080:80"
    volumes:
      - ./status:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  redis_data:
  api_data:
