name: solo-operator

x-defaults: &defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  networks:
    - backend
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: 3

services:
  api:
    <<: *defaults
    build:
      context: ./my-node-app
      dockerfile: Dockerfile
    container_name: my-node-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DB_URL: sqlite:///data/app.db
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - api_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redis:
    <<: *defaults
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    image: redis:7.4-alpine
    container_name: my-node-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD}", "--protected-mode", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  pipeline:
    <<: *defaults
    build:
      context: ./csv-pipeline
      dockerfile: Dockerfile
    container_name: csv-pipeline
    volumes:
      - ./csv-pipeline/incoming:/app/incoming
      - ./csv-pipeline/processed:/app/processed
      - ./csv-pipeline/archive:/app/archive
    environment:
      PYTHONUNBUFFERED: "1"
      PIPELINE_INTERVAL: "10"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEBHOOK_URL: ""
    command: ["python", "pipeline.py", "--watch", "--interval", "10"]
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  dashboard:
    <<: *defaults
    build:
      context: ./csv-pipeline/dashboard
      dockerfile: Dockerfile
    container_name: csv-dashboard
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - ./csv-pipeline/incoming:/app/incoming
      - ./csv-pipeline/processed:/app/processed:ro
      - ./csv-pipeline/archive:/app/archive:ro
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_DIR: /app
    depends_on:
      pipeline:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/api/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  status:
    <<: *defaults
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    image: nginx:1.27-alpine
    container_name: solo-status
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./status:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

networks:
  backend:
    driver: bridge

volumes:
  redis_data:
  api_data:
